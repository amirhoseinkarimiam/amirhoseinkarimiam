<svg width="100%" height="306" viewBox="0 0 900 306" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="staticNoiseK" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="turb">
        <animate attributeName="baseFrequency" values="0.85;0.6;0.9;0.7;0.85" dur="0.6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="turb" type="saturate" values="0"/>
    </filter>
    <pattern id="scanlinesK" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vignette_skillsK" cx="50%" cy="40%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="glare_skillsK" cx="26%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="306" rx="16" fill="#050505"/>
  <rect x="6" y="6" width="888" height="294" rx="10" fill="#000000"/>
  <rect x="6" y="6" width="888" height="294" filter="url(#staticNoiseK)" opacity="0.05"/>
  <rect x="6" y="6" width="888" height="294" fill="url(#scanlinesK)"/>

  <!-- header strip -->
  <text x="30" y="30" font-family="'Courier New', monospace" font-size="12" fill="#888888" text-anchor="start">CH 02</text>
  <circle cx="858" cy="26" r="4" fill="#e11d1d">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Courier New', monospace" text-anchor="middle">
    <text x="452" y="45" font-size="21" font-weight="bold" fill="#ff3b3b" opacity="0.35">CH.02 — FREQUENCIES</text>
    <text x="448" y="45" font-size="21" font-weight="bold" fill="#3bd6ff" opacity="0.35">CH.02 — FREQUENCIES</text>
    <text x="450" y="45" font-size="21" font-weight="bold" fill="#ffffff">CH.02 — FREQUENCIES</text>
  </g>

  <line x1="34" y1="68" x2="866" y2="68" stroke="#262626" stroke-width="1"/>

  <!-- FRONTEND -->
  <rect x="34" y="90" width="10" height="10" rx="2" fill="#3bd6ff"/>
  <text x="54" y="99" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff">FRONTEND</text>
  <text x="34" y="124" font-family="'Courier New', monospace" font-size="13" fill="#999999">React · TypeScript · JavaScript · Tailwind CSS · HTML5 · CSS3</text>

  <line x1="34" y1="146" x2="866" y2="146" stroke="#1e1e1e" stroke-width="1"/>

  <!-- BACKEND -->
  <rect x="34" y="164" width="10" height="10" rx="2" fill="#3bd6ff"/>
  <text x="54" y="173" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff">BACKEND</text>
  <text x="34" y="198" font-family="'Courier New', monospace" font-size="13" fill="#999999">Django · Python · PostgreSQL</text>

  <line x1="34" y1="220" x2="866" y2="220" stroke="#1e1e1e" stroke-width="1"/>

  <!-- TOOLING -->
  <rect x="34" y="238" width="10" height="10" rx="2" fill="#3bd6ff"/>
  <text x="54" y="247" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff">TOOLING</text>
  <text x="34" y="272" font-family="'Courier New', monospace" font-size="13" fill="#999999">Git · GitHub · Docker · VS Code</text>

  <rect x="6" y="6" width="888" height="294" rx="10" fill="url(#glare_skillsK)"/>
  <rect x="6" y="6" width="888" height="294" rx="10" fill="url(#vignette_skillsK)"/>
</svg>
