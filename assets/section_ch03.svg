<svg width="100%" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="staticNoise4" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="turb">
        <animate attributeName="baseFrequency" values="0.85;0.6;0.9;0.7;0.85" dur="0.5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="turb" type="saturate" values="0"/>
    </filter>
    <pattern id="scanlines4" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <linearGradient id="edge4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="vignette_ch03" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="glare_ch03" cx="26%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="110" rx="16" fill="#050505"/>
  <rect x="6" y="6" width="888" height="98" rx="10" fill="#000000"/>

  <rect x="6" y="6" width="888" height="98" filter="url(#staticNoise4)" opacity="0.22">
    <animate attributeName="opacity" values="0.16;0.3;0.14;0.26;0.16" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <rect x="6" y="6" width="888" height="98" fill="url(#scanlines4)"/>
  <rect x="6" y="6" width="888" height="98" fill="url(#edge4)"/>

  <g font-family="'Courier New', monospace" text-anchor="middle">
    <text x="452" y="63" font-size="26" fill="#9a9a9a" opacity="0.6">
      CH.03 — RECORDED TAPES
      <animate attributeName="x" values="452;448;456;450;452" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="452" y="64" font-size="26" font-weight="bold" fill="#ff3b3b" opacity="0.45">CH.03 — RECORDED TAPES</text>
    <text x="448" y="64" font-size="26" font-weight="bold" fill="#3bd6ff" opacity="0.45">CH.03 — RECORDED TAPES</text>
    <text x="450" y="64" font-size="26" font-weight="bold" fill="#ffffff">CH.03 — RECORDED TAPES</text>
  </g>

  <text x="30" y="30" font-family="'Courier New', monospace" font-size="12" fill="#888888" text-anchor="start">CH 03</text>
  <circle cx="855" cy="26" r="4" fill="#e11d1d">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <rect x="6" y="6" width="888" height="98" rx="10" fill="url(#glare_ch03)"/>
  <rect x="6" y="6" width="888" height="98" rx="10" fill="url(#vignette_ch03)"/>
</svg>