<svg width="100%" height="288" viewBox="0 0 900 288" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="staticNoiseI" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="turb">
        <animate attributeName="baseFrequency" values="0.85;0.6;0.9;0.7;0.85" dur="0.6s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="turb" type="saturate" values="0"/>
    </filter>
    <pattern id="scanlinesI" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vignette_intro" cx="50%" cy="40%" r="80%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="glare_intro" cx="26%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="288" rx="16" fill="#050505"/>
  <rect x="6" y="6" width="888" height="276" rx="10" fill="#000000"/>
  <rect x="6" y="6" width="888" height="276" filter="url(#staticNoiseI)" opacity="0.05"/>
  <rect x="6" y="6" width="888" height="276" fill="url(#scanlinesI)"/>

  <!-- header strip -->
  <text x="30" y="30" font-family="'Courier New', monospace" font-size="12" fill="#888888" text-anchor="start">CH 01</text>
  <circle cx="858" cy="26" r="4" fill="#e11d1d">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Courier New', monospace" text-anchor="middle">
    <text x="452" y="45" font-size="21" font-weight="bold" fill="#ff3b3b" opacity="0.35">CH.01 — ON AIR</text>
    <text x="448" y="45" font-size="21" font-weight="bold" fill="#3bd6ff" opacity="0.35">CH.01 — ON AIR</text>
    <text x="450" y="45" font-size="21" font-weight="bold" fill="#ffffff">CH.01 — ON AIR</text>
  </g>

  <line x1="34" y1="68" x2="866" y2="68" stroke="#262626" stroke-width="1"/>

  <!-- content -->
  <g font-family="'Courier New', monospace">
    <text x="34" y="102" font-size="19" font-weight="bold" fill="#ffffff">Amirhosein Karimi</text>
    <text x="34" y="128" font-size="15" fill="#aaaaaa">Full-stack developer — React + TypeScript on the front, Django on the back.</text>
    <text x="34" y="150" font-size="15" fill="#aaaaaa">I turn ideas into working products, end to end.</text>

    <line x1="34" y1="174" x2="866" y2="174" stroke="#222222" stroke-width="1"/>

    <text x="34" y="204" font-size="15" fill="#888888">&gt; BUILDS</text>
    <text x="230" y="204" font-size="15" fill="#eeeeee">Landing pages · admin dashboards · small MVPs</text>

    <text x="34" y="232" font-size="15" fill="#888888">&gt; STACK</text>
    <text x="230" y="232" font-size="15" fill="#eeeeee">React + TypeScript on the front, Django on the back</text>

    <text x="34" y="260" font-size="15" fill="#888888">&gt; STATUS</text>
    <text x="230" y="260" font-size="15" fill="#eeeeee">Open to freelance / contract work &amp; junior roles</text>
  </g>

  <rect x="6" y="6" width="888" height="276" rx="10" fill="url(#glare_intro)"/>
  <rect x="6" y="6" width="888" height="276" rx="10" fill="url(#vignette_intro)"/>
</svg>
