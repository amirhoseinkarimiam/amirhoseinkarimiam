<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="staticNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="turb">
        <animate attributeName="baseFrequency" values="0.85;0.6;0.9;0.7;0.85" dur="0.5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="turb" type="saturate" values="0"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="78%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.92"/>
    </radialGradient>
    <radialGradient id="curveGlare" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="10" y="10" width="880" height="230" rx="0"/>
    </clipPath>
    <linearGradient id="edgeGlowBanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowBanner" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- TV bezel -->
  <rect x="0" y="0" width="900" height="250" rx="0" fill="#050505"/>
  <rect x="2" y="2" width="896" height="246" rx="0" fill="none" stroke="url(#edgeGlowBanner)" stroke-width="3" opacity="0.9" filter="url(#glowBanner)"/>
  <rect x="10" y="10" width="880" height="230" rx="0" fill="#000000"/>

  <!-- corner brackets (viewfinder frame) -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M10,32 L10,12 L30,12" stroke="#ffffff" opacity="0.9"/>
    <path d="M870,12 L890,12 L890,32" stroke="#ffffff" opacity="0.9"/>
    <path d="M10,218 L10,238 L30,238" stroke="#ffffff" opacity="0.9"/>
    <path d="M870,238 L890,238 L890,218" stroke="#ffffff" opacity="0.9"/>
  </g>

  <g clip-path="url(#screenClip)">
    <!-- static noise -->
    <rect x="10" y="10" width="880" height="230" filter="url(#staticNoise)" opacity="0.28">
      <animate attributeName="opacity" values="0.22;0.4;0.18;0.35;0.22" dur="0.6s" repeatCount="indefinite"/>
    </rect>

    <!-- scanlines -->
    <rect x="10" y="10" width="880" height="230" fill="url(#scanlines)"/>

    <!-- glitch title with chromatic-aberration color fringing -->
    <g font-family="'Courier New', monospace" text-anchor="middle">
      <text x="453" y="119" font-size="40" fill="#ff3b3b" opacity="0.55">
        AMIRHOSEIN KARIMI
        <animate attributeName="x" values="453;449;456;451;453" dur="2.4s" repeatCount="indefinite"/>
      </text>
      <text x="447" y="119" font-size="40" fill="#3bd6ff" opacity="0.55">
        AMIRHOSEIN KARIMI
        <animate attributeName="x" values="447;451;444;449;447" dur="2.1s" repeatCount="indefinite"/>
      </text>
      <text x="450" y="119" font-size="40" font-weight="bold" fill="#ffffff">AMIRHOSEIN KARIMI</text>

      <text x="450" y="155" font-size="16" letter-spacing="4" fill="#b5b5b5">JUNIOR FULL STACK DEVELOPER</text>
    </g>

    <!-- recording indicator -->
    <circle cx="835" cy="30" r="5" fill="#e11d1d">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="847" y="35" font-family="'Courier New', monospace" font-size="14" fill="#e11d1d" text-anchor="start">REC</text>

    <!-- small tuning dial ticks, bottom-left -->
    <g font-family="'Courier New', monospace" font-size="10" fill="#555555">
      <text x="24" y="222">01</text>
      <text x="50" y="222">02</text>
      <text x="76" y="222" fill="#e11d1d">03</text>
      <text x="102" y="222">04</text>
      <text x="128" y="222">05</text>
    </g>

    <!-- rolling tracking-error bar -->
    <rect x="10" width="880" height="6" fill="#ffffff" opacity="0.06">
      <animate attributeName="y" values="30;210;90;180;40;230" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- barrel curvature glare -->
    <rect x="10" y="10" width="880" height="230" fill="url(#curveGlare)"/>
    <!-- vignette (screen curvature darkening at edges) -->
    <rect x="10" y="10" width="880" height="230" fill="url(#vignette)"/>
  </g>
</svg>
