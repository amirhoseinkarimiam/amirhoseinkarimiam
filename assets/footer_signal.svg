<svg width="100%" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="staticNoise6" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="turb">
        <animate attributeName="baseFrequency" values="0.85;0.6;0.9;0.7;0.85" dur="0.5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="turb" type="saturate" values="0"/>
    </filter>
    <pattern id="scanlines6" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <linearGradient id="edge6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="8%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="92%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="vignette_footer" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="glare_footer" cx="26%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeGlowFooter" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowFooter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="110" rx="0" fill="#050505"/>
  <rect x="2" y="2" width="896" height="106" rx="0" fill="none" stroke="url(#edgeGlowFooter)" stroke-width="3" opacity="0.9" filter="url(#glowFooter)"/>
  <rect x="6" y="6" width="888" height="98" rx="0" fill="#000000"/>

  <!-- corner brackets (viewfinder frame) -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M6,28 L6,8 L26,8" stroke="#ffffff" opacity="0.9"/>
    <path d="M874,8 L894,8 L894,28" stroke="#ffffff" opacity="0.9"/>
    <path d="M6,82 L6,102 L26,102" stroke="#ffffff" opacity="0.9"/>
    <path d="M874,102 L894,102 L894,82" stroke="#ffffff" opacity="0.9"/>
  </g>

  <rect x="6" y="6" width="888" height="98" filter="url(#staticNoise6)" opacity="0.22">
    <animate attributeName="opacity" values="0.16;0.3;0.14;0.26;0.16" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <rect x="6" y="6" width="888" height="98" fill="url(#scanlines6)"/>
  <rect x="6" y="6" width="888" height="98" fill="url(#edge6)"/>

  <g font-family="'Courier New', monospace" text-anchor="middle">
    <text x="452" y="63" font-size="26" fill="#9a9a9a" opacity="0.6">
      — END OF TRANSMISSION —
      <animate attributeName="x" values="452;448;456;450;452" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="452" y="64" font-size="26" font-weight="bold" fill="#ff3b3b" opacity="0.45">— END OF TRANSMISSION —</text>
    <text x="448" y="64" font-size="26" font-weight="bold" fill="#3bd6ff" opacity="0.45">— END OF TRANSMISSION —</text>
    <text x="450" y="64" font-size="26" font-weight="bold" fill="#ffffff">— END OF TRANSMISSION —</text>
  </g>

  <text x="30" y="30" font-family="'Courier New', monospace" font-size="12" fill="#888888" text-anchor="start">NO SIGNAL</text>
  <circle cx="855" cy="26" r="4" fill="#e11d1d">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="86" font-family="'Courier New', monospace" font-size="13" fill="#888888" text-anchor="middle">thanks for tuning in — drop a star on a repo before you go</text>
  <rect x="6" y="6" width="888" height="98" fill="url(#glare_footer)"/>
  <rect x="6" y="6" width="888" height="98" fill="url(#vignette_footer)"/>
</svg>
